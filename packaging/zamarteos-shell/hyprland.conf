# ZamarteOS Pure — initial Wayland session for Fairphone 4.
# Touch-first portrait shell. Hardware-specific input tuning comes later.

monitor = ,preferred,auto,1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 22
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    kb_layout = pl
    follow_mouse = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Import the compositor environment before starting user session services.
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP
exec-once = systemctl --user start moarchy-session.target
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = /usr/lib/geoclue-2.0/demos/agent
exec-once = moarchy-keyboard
exec-once = swayidle -w timeout 600 'moarchy-idle-action' resume 'moarchy-screen wake' before-sleep 'moarchy-lock'

# Start only the ZamarteOS QML shell; do not start the upstream Moarchy shell.
exec-once = zamarteos-shell

# Emergency keyboard shortcuts when a hardware keyboard is attached.
bind = SUPER, Q, killactive
bind = SUPER, M, exit

# Physical volume buttons on Fairphone 4.
# Use the existing PipeWire/WirePlumber mixer; do not touch modem/audio routing.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
