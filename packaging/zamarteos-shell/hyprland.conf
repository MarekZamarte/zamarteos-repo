# ZamarteOS Pure — initial Wayland session for Fairphone 4.
# Touch-first portrait shell. Hardware-specific input tuning comes later.

monitor = ,preferred,auto,1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = dwindle
}

decoration {
    rounding = 22
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    kb_layout = pl
    follow_mouse = 0
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

exec-once = zamarteos-shell

# Emergency keyboard shortcuts when a hardware keyboard is attached.
bind = SUPER, Q, killactive
bind = SUPER, M, exit
