name: ZamarteOS shell package check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - zamarteos-pure-fp4-dev
    paths:
      - "packaging/zamarteos-shell/**"
      - ".github/workflows/fp4-shell-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-shell-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Enable ARM64 container execution
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build package in pinned Arch Linux ARM environment
        run: |
          set -euxo pipefail
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/repo" \
            -w /repo/packaging/zamarteos-shell \
            docker.io/menci/archlinuxarm@sha256:f7c6f64c0f246f41775e01793340c49f8e9abf3991141c25405361d56b100ccb \
            bash -lc '
              set -euxo pipefail
              pacman -Syu --noconfirm base-devel quickshell hyprland qt6-declarative
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
              chown -R builder:builder /repo
              runuser -u builder -- makepkg --noconfirm --cleanbuild
              ls -lh *.pkg.tar.*
            '

  overlay-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned FP4 base
        run: |
          set -euxo pipefail
          git clone https://github.com/taufderl/moarchy.git moarchy-base
          git -C moarchy-base checkout --detach c78bcd1f43340c447e0016ab45a5fa99f186810c

      - name: Apply and verify ZamarteOS integration
        run: |
          set -euxo pipefail
          bash scripts/apply-zamarteos-overlay.sh moarchy-base
          bash -n moarchy-base/bin/moarchy-lock
          bash -n moarchy-base/bin/moarchy-restart-shell
          grep -q "'zamarteos-shell'" moarchy-base/pkgbuilds/moarchy-meta/PKGBUILD
          grep -q "qs ipc call zamarteos-lock lock" moarchy-base/bin/moarchy-lock
          grep -q "quickshell -n -p /usr/share/zamarteos-shell" moarchy-base/bin/moarchy-restart-shell
          test -f moarchy-base/pkgbuilds/zamarteos-shell/shell.qml
          test -f moarchy-base/pkgbuilds/zamarteos-shell/zamarteos-lock.pam
          git -C moarchy-base diff --check
