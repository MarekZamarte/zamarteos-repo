name: ZamarteOS Hybrid FP4 — source audit (not an image)

on:
  workflow_dispatch:
  push:
    branches:
      - zamarteos-hybrid-fp4-dev
    paths:
      - "hybrid/**"
      - "docs/HYBRID-PLAN-PL.md"
      - "scripts/audit-fp4-halium-source.sh"
      - ".github/workflows/fp4-hybrid-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: zamarteos-hybrid-fp4-source-audit
  cancel-in-progress: false

jobs:
  audit-upstream-device-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout ZamarteOS Hybrid manifest
        uses: actions/checkout@v4

      - name: Validate Hybrid manifest
        run: |
          set -euxo pipefail
          grep -Fx 'device: fairphone-fp4' hybrid/manifest.yml
          grep -Fx 'codename: FP4' hybrid/manifest.yml
          grep -Fx 'compatibility_layer: Halium' hybrid/manifest.yml
          grep -Fx 'halium_version: "11"' hybrid/manifest.yml
          grep -Fx 'target_userspace: ZamarteOS Linux' hybrid/manifest.yml
          grep -Fx 'flash_automatically: false' hybrid/manifest.yml
          bash -n scripts/audit-fp4-halium-source.sh

      - name: Fetch FP4 Halium 11 device port
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch focal \
            https://gitlab.com/ubports/porting/reference-device-ports/android11/fairphone-4/fairphone-fp4.git \
            upstream-fairphone-fp4
          git -C upstream-fairphone-fp4 rev-parse HEAD | tee upstream-device-port-commit.txt
          test -s upstream-fairphone-fp4/deviceinfo

      - name: Audit device source metadata
        run: |
          set -euxo pipefail
          bash scripts/audit-fp4-halium-source.sh upstream-fairphone-fp4 hybrid-device-audit.txt
          cat hybrid-device-audit.txt

      - name: Fetch candidate FP4 kernel source
        run: |
          set -euxo pipefail
          git clone --depth 1 \
            https://gitlab.com/ubports/porting/reference-device-ports/android11/fairphone-4/kernel-fairphone-sm7225.git \
            upstream-fp4-kernel
          git -C upstream-fp4-kernel rev-parse HEAD | tee upstream-kernel-commit.txt
          test -s upstream-fp4-kernel/Makefile
          test -d upstream-fp4-kernel/drivers

      - name: Audit kernel candidate (not yet declared compatible)
        run: |
          set -euxo pipefail
          {
            echo "Candidate kernel repository: kernel-fairphone-sm7225"
            echo "This default-branch snapshot is an audit candidate only."
            echo "Compatibility with deviceinfo must be established before building."
            git -C upstream-fp4-kernel remote -v
            git -C upstream-fp4-kernel log -1 --format=fuller
            echo
            echo "Kernel version:"
            head -n 5 upstream-fp4-kernel/Makefile
            echo
            echo "Relevant FP4/Qualcomm/audio paths:"
            find upstream-fp4-kernel -maxdepth 4 -type d \\( -iname '*qcom*' -o -iname '*audio*' -o -iname '*sound*' -o -iname '*sm7225*' \\) -print | sort | head -n 250
          } | tee hybrid-kernel-audit.txt

      - name: Upload source audit (not flashable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zamarteos-hybrid-fp4-source-audit-${{ github.run_number }}
          path: |
            hybrid-device-audit.txt
            hybrid-kernel-audit.txt
            upstream-device-port-commit.txt
            upstream-kernel-commit.txt
          if-no-files-found: warn
          retention-days: 30
