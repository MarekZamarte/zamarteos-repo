name: ZamarteOS Hybrid FP4 — source audit (not an image)

on:
  workflow_dispatch:
  push:
    branches:
      - zamarteos-hybrid-fp4-dev
    paths:
      - "hybrid/**"
      - "docs/HYBRID-PLAN-PL.md"
      - "scripts/audit-fp4-halium-source.sh"
      - "scripts/resolve-fp4-kernel-source.py"
      - ".github/workflows/fp4-hybrid-source-audit.yml"

permissions:
  contents: read

concurrency:
  group: zamarteos-hybrid-fp4-source-audit
  cancel-in-progress: false

jobs:
  audit-upstream-device-port:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout ZamarteOS Hybrid manifest
        uses: actions/checkout@v4

      - name: Validate Hybrid manifest
        run: |
          set -euxo pipefail
          grep -Fx 'device: fairphone-fp4' hybrid/manifest.yml
          grep -Fx 'codename: FP4' hybrid/manifest.yml
          grep -Fx 'compatibility_layer: Halium' hybrid/manifest.yml
          grep -Fx 'halium_version: "11"' hybrid/manifest.yml
          grep -Fx 'target_userspace: ZamarteOS Linux' hybrid/manifest.yml
          grep -Fx 'flash_automatically: false' hybrid/manifest.yml
          bash -n scripts/audit-fp4-halium-source.sh

      - name: Fetch FP4 Halium 11 device port
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch focal \
            https://gitlab.com/ubports/porting/reference-device-ports/android11/fairphone-4/fairphone-fp4.git \
            upstream-fairphone-fp4
          git -C upstream-fairphone-fp4 rev-parse HEAD | tee upstream-device-port-commit.txt
          test -s upstream-fairphone-fp4/deviceinfo

      - name: Audit device source metadata
        run: |
          set -euxo pipefail
          bash scripts/audit-fp4-halium-source.sh upstream-fairphone-fp4 hybrid-device-audit.txt
          cat hybrid-device-audit.txt

      - name: Resolve kernel source from deviceinfo
        id: kernel
        run: |
          set -euxo pipefail
          python3 scripts/resolve-fp4-kernel-source.py upstream-fairphone-fp4/deviceinfo

      - name: Fetch exact kernel source declared by deviceinfo
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch "${{ steps.kernel.outputs.kernel_branch }}" \
            "${{ steps.kernel.outputs.kernel_source }}" upstream-fp4-kernel
          git -C upstream-fp4-kernel rev-parse HEAD | tee upstream-kernel-commit.txt
          test -s upstream-fp4-kernel/Makefile
          test -d upstream-fp4-kernel/drivers

      - name: Audit kernel configuration against deviceinfo
        run: |
          set -euxo pipefail
          python3 - upstream-fairphone-fp4/deviceinfo upstream-fp4-kernel hybrid-kernel-audit.txt <<'PY'
          from pathlib import Path
          import re, sys
          deviceinfo, kernel, output = Path(sys.argv[1]), Path(sys.argv[2]), Path(sys.argv[3])
          text = deviceinfo.read_text()
          def val(name):
              for line in text.splitlines():
                  if line.startswith(name + "="):
                      return line.split("=", 1)[1].strip().strip("'\\\"")
              raise SystemExit(f"Missing {name} in deviceinfo")
          configs = val("deviceinfo_kernel_defconfig").split()
          config_dirs = [kernel / "arch/arm64/configs", kernel / "arch/arm/configs"]
          lines = ["ZamarteOS Hybrid FP4 kernel audit", f"kernel_commit={__import__('subprocess').check_output(['git','-C',str(kernel),'rev-parse','HEAD'],text=True).strip()}", f"kernel_defconfig={ ' '.join(configs) }"]
          missing=[]
          for name in configs:
              found=[str(d/name) for d in config_dirs if (d/name).is_file()]
              lines.append(f"config {name}: " + (", ".join(found) if found else "MISSING"))
              if not found: missing.append(name)
          lines.append("kernel_makefile_version:")
          lines.extend(kernel.joinpath("Makefile").read_text(errors="replace").splitlines()[:5])
          lines.append("relevant_audio_and_qcom_directories:")
          for p in sorted(kernel.rglob("*")):
              if p.is_dir() and any(k in p.name.lower() for k in ("qcom","audio","sound","sm7225")):
                  rel=p.relative_to(kernel)
                  if len(rel.parts)<=5: lines.append(str(rel))
          output.write_text("\\n".join(lines)+"\\n")
          print(output.read_text())
          if missing: raise SystemExit("Kernel defconfig(s) from deviceinfo not found: " + ", ".join(missing))
          PY

      - name: Upload source audit (not flashable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zamarteos-hybrid-fp4-source-audit-${{ github.run_number }}
          path: |
            hybrid-device-audit.txt
            hybrid-kernel-audit.txt
            upstream-device-port-commit.txt
            upstream-kernel-commit.txt
          if-no-files-found: warn
          retention-days: 30
