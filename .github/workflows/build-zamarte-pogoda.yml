name: Build Zamarte Pogoda RPM

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/zamarte-weather/**'
      - '.github/workflows/build-zamarte-pogoda.yml'

permissions:
  contents: read

jobs:
  build-rpm:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y curl libegl1 libxkbcommon-x11-0 libxcb-xinerama0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xkb1 libxcb-xfixes0 libxcb-shape0 libxcb-sync1 libxcb-util1
          docker --version
          sudo systemctl start docker

      - name: Install Sailfish SDK headlessly
        env:
          QT_QPA_PLATFORM: minimal
          LANG: C
          LC_ALL: C
        run: |
          curl -fL --retry 3 https://releases.sailfishos.org/sdk/installers/3.13.5/SailfishSDK-3.13.5-linux64-online.run -o /tmp/sailfish-sdk.run
          chmod +x /tmp/sailfish-sdk.run
          /tmp/sailfish-sdk.run non-interactive=1 accept-licenses=1 build-engine-type=docker

      - name: Install Sailfish 5.0 compatible target and build
        env:
          LANG: C
          LC_ALL: C
        run: |
          SFDK="$HOME/SailfishOS/bin/sfdk"
          test -x "$SFDK"
          "$SFDK" engine start
          # Keep prompts in English and answer the install-custom confirmations
          # automatically; otherwise the localized yes/no prompt can loop.
          TOOLING="SailfishOS-5.0.0.62"
          TARGET="${TOOLING}-aarch64"
          yes yes | "$SFDK" tools install-custom "$TOOLING" "https://releases.sailfishos.org/sdk/targets/Sailfish_OS-5.0.0.62-Sailfish_SDK_Tooling-i486.tar.7z"
          yes yes | "$SFDK" tools install-custom "$TARGET" "https://releases.sailfishos.org/sdk/targets/Sailfish_OS-5.0.0.62-Sailfish_SDK_Target-aarch64.tar.7z"
          "$SFDK" tools list | tee /tmp/sfdk-tools.txt
          grep -Fq "$TARGET" /tmp/sfdk-tools.txt
          "$SFDK" config --push target "$TARGET"
          cd apps/zamarte-weather
          mkdir -p SOURCES rpm
          cp harbour-zamarteweather.spec rpm/harbour-zamarteweather.spec
          tar -cjf SOURCES/harbour-zamarteweather-0.1.0.tar.bz2 \
            --transform='s,^apps/zamarte-weather,harbour-zamarteweather-0.1.0,' \
            --exclude='apps/zamarte-weather/SOURCES' \
            --exclude='apps/zamarte-weather/RPMS' \
            --exclude='apps/zamarte-weather/rpm' \
            -C ../.. apps/zamarte-weather
          "$SFDK" build
          find RPMS -type f -name '*.rpm' -print -quit | grep -q .

      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: zamarte-pogoda-rpm-aarch64
          path: apps/zamarte-weather/RPMS/*.rpm
          if-no-files-found: error
          retention-days: 30
